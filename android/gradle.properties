# AGP 8.12 + Flutter engine jars OOMs under JetifyTransform at 1.5G; 4G is a safe release-build default.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Jetifier is unnecessary for this AndroidX-only Flutter app and was OOM'ing on Flutter engine AARs under AGP 8.12.
android.enableJetifier=false

# Google Play (Nov 2025+): 16 KB page size on 64-bit devices — use AGP 8.5.1+ (see settings.gradle.kts) and NDK r28+ (see app/build.gradle.kts).
# Uncompressed native libs + correct zip alignment are handled by AGP 8.5.1+ when packaging AAB/APK.

# Run without daemon to avoid "daemon disappeared" / JVM crash when project and Pub cache are on different drives
org.gradle.daemon=false

# Avoid Kotlin "different roots" error when project (E:) and Pub cache (C:) are on different drives
kotlin.incremental=false
