org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Google Play (Nov 2025+): 16 KB page size on 64-bit devices — use AGP 8.5.1+ (see settings.gradle.kts) and NDK r28+ (see app/build.gradle.kts).
# Uncompressed native libs + correct zip alignment are handled by AGP 8.5.1+ when packaging AAB/APK.

# Run without daemon to avoid "daemon disappeared" / JVM crash when project and Pub cache are on different drives
org.gradle.daemon=false

# Avoid Kotlin "different roots" error when project (E:) and Pub cache (C:) are on different drives
kotlin.incremental=false
