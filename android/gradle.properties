org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Run without daemon to avoid "daemon disappeared" / JVM crash when project and Pub cache are on different drives
org.gradle.daemon=false

# Avoid Kotlin "different roots" error when project (E:) and Pub cache (C:) are on different drives
kotlin.incremental=false
