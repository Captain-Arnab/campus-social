name: MiCampus
description: A new Flutter project for Campus Events.
publish_to: 'none'
version: 1.1.2+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # Firebase
  firebase_core: ^2.30.0
  firebase_messaging: ^14.9.0
  # State Management & Routing
  get: ^4.6.6
  flutter_local_notifications: ^17.2.2
  device_info_plus: ^10.1.2
  # Networking
  dio: ^5.4.0
  # Local Storage
  shared_preferences: ^2.2.2
  # UI Utilities
  flutter_screenutil: ^5.9.0
  intl: ^0.19.0
  # Media
  image_picker: ^1.0.7
  image: ^4.3.0
  cached_network_image: ^3.4.0
  carousel_slider: ^5.1.1
  # Icons
  cupertino_icons: ^1.0.6
  path_provider: ^2.1.2    # To find local storage paths
  pdf: ^3.10.7             # For PDF generation
  saver_gallery: ^3.0.6    # To save images to the phone gallery (kept on 3.x for share_plus / mime resolution)
  permission_handler: ^11.0.1
  google_fonts: ^6.2.1
  http: ^1.1.0
  pin_code_fields: ^8.0.1
  url_launcher: ^6.2.0
  art_sweetalert_new: ^1.0.0
  open_filex: ^4.7.0
  any_link_preview: ^3.0.2
  video_player: ^2.9.2
  file_picker: ^8.0.7
  path: ^1.9.0
  webview_flutter: ^4.10.0
  share_plus: ^7.2.2
  app_links: ^6.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.13.1"
  flutter_lints: ^3.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.jpeg"

flutter:
  uses-material-design: true
  
  # Assets (directory entries only — listing files already under a dir
  # causes PathExistsException on Windows when Flutter copies them twice)
  assets:
    - assets/images/
    - assets/images/basketball/
    - assets/images/innovation/
    - assets/images/music/
    - assets/images/graduation/
    - assets/images/online_course/